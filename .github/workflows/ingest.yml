name: Ingest wastewater data

# Heavy ingestion runs here (not on Vercel): no function timeouts, generous free minutes.
# Produces public/aggregates/*.json (committed → triggers a Vercel redeploy) and, if R2
# secrets are configured, uploads the site-level Parquet lake to Cloudflare R2.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC (most sources update weekly)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ingestion
        env:
          # Optional Cloudflare R2 sink (set as repo secrets to enable parquet upload).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: npm run ingest:all

      - name: Commit refreshed aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/aggregates
          if git diff --cached --quiet; then
            echo "No aggregate changes."
          else
            git commit -m "data: refresh wastewater aggregates [skip ci]"
            git push
          fi
